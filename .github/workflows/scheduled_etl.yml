name: Scheduled Serverless ETL (Cloud Runner)

on:
  schedule:
    # 13:00 UTC = 08:00 AM Hora de Lima (PET)
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite dispararlo a mano con un clic en la pestaña "Actions" de GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest
    name: Execute Cloud ETL to Parquet / Data Lake

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore Parquet Lakehouse & Checkpoint Cache
      uses: actions/cache@v4
      with:
        path: |
          data/datalake
          data/checkpoint.json
        key: gastos-lakehouse-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          gastos-lakehouse-${{ runner.os }}-

    - name: Run ETL Pipeline (Serverless Cloud Mode)
      env:
        PYTHONPATH: src
        STORAGE_SINK: auto
        # Credenciales seguras inyectadas desde GitHub Secrets (100% Gratis, 0 Tarjetas)
        IMAP_HOST: ${{ secrets.IMAP_HOST || 'imap.gmail.com' }}
        IMAP_PORT: ${{ secrets.IMAP_PORT || 993 }}
        IMAP_USER: ${{ secrets.IMAP_USER }}
        IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
        # Variables Cloud opcionales (vacías por defecto)
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        python scripts/run_local.py

    - name: Upload Parquet Artifacts (Descargable desde la web de GitHub)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gastos-parquet-datalake
        path: data/datalake/
        if-no-files-found: ignore
        retention-days: 90
